openapi: 3.0.3
info:
  title: SSCMS API
  description: 'Smart Student Club Management System -- Backend Sprint 1 (Milestone
    3) covered Epics 1-3: Role-Based Portal Access & Onboarding, Venue Booking & Asset
    Management, and Event Lifecycle & Approval Workflows. Backend Sprint 2 (Milestone
    4) adds Epics 4-6: Task Management & Volunteer Workflows, QR Attendance & Live
    Execution, and Certification & Budget Analytics.'
  version: 1.1.0
paths:
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Register
      operationId: register_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '409':
          description: student_id or email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Read Current User
      operationId: read_current_user_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
      security:
      - OAuth2PasswordBearer: []
  /auth/change-password:
    post:
      tags:
      - Authentication
      summary: Change Password
      operationId: change_password_auth_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /auth/bulk-import:
    post:
      tags:
      - Authentication
      summary: Bulk Import Users Auth Alias
      operationId: bulk_import_users_auth_alias_auth_bulk_import_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_bulk_import_users_auth_alias_auth_bulk_import_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUserImportOut'
        '403':
          description: Faculty Coordinator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /me/memberships:
    get:
      tags:
      - Clubs & Membership
      summary: List My Memberships
      operationId: list_my_memberships_me_memberships_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ClubMemberOut'
                type: array
                title: Response List My Memberships Me Memberships Get
      security:
      - OAuth2PasswordBearer: []
  /me/volunteer-applications:
    get:
      tags:
      - Clubs & Membership
      summary: List My Volunteer Applications
      operationId: list_my_volunteer_applications_me_volunteer_applications_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VolunteerApplicationOut'
                type: array
                title: Response List My Volunteer Applications Me Volunteer Applications
                  Get
      security:
      - OAuth2PasswordBearer: []
  /clubs:
    get:
      tags:
      - Clubs & Membership
      summary: List Clubs
      operationId: list_clubs_clubs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ClubOut'
                type: array
                title: Response List Clubs Clubs Get
    post:
      tags:
      - Clubs & Membership
      summary: Create Club
      operationId: create_club_clubs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubCreateResponse'
        '409':
          description: Club name or club head email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /clubs/{club_id}:
    get:
      tags:
      - Clubs & Membership
      summary: Get Club
      operationId: get_club_clubs__club_id__get
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubOut'
        '404':
          description: Club not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Clubs & Membership
      summary: Update Club
      operationId: update_club_clubs__club_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubOut'
        '403':
          description: Caller cannot manage this club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Club not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Clubs & Membership
      summary: Delete Club
      operationId: delete_club_clubs__club_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      responses:
        '204':
          description: Successful Response
        '403':
          description: Caller cannot manage this club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Club not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clubs/{club_id}/club-head/reset-password:
    post:
      tags:
      - Clubs & Membership
      summary: Reset Club Head Password
      operationId: reset_club_head_password_clubs__club_id__club_head_reset_password_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubHeadPasswordReset'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubHeadPasswordResetOut'
        '403':
          description: Caller cannot manage this club
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Club or Club Head not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clubs/{club_id}/review:
    post:
      tags:
      - Clubs & Membership
      summary: Review Club
      operationId: review_club_clubs__club_id__review_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubReview'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubOut'
        '404':
          description: Club not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Club is not in Pending status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clubs/{club_id}/members/apply:
    post:
      tags:
      - Clubs & Membership
      summary: Apply For Membership
      operationId: apply_for_membership_clubs__club_id__members_apply_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubMemberOut'
        '404':
          description: Club not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Already a member or already applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clubs/{club_id}/members:
    get:
      tags:
      - Clubs & Membership
      summary: List Club Members
      operationId: list_club_members_clubs__club_id__members_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      - name: status_filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Filter
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClubMemberOut'
                title: Response List Club Members Clubs  Club Id  Members Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clubs/{club_id}/members/{member_id}/review:
    post:
      tags:
      - Clubs & Membership
      summary: Review Membership
      operationId: review_membership_clubs__club_id__members__member_id__review_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      - name: member_id
        in: path
        required: true
        schema:
          type: integer
          title: Member Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationReview'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubMemberOut'
        '403':
          description: Caller is not this club's Club Head
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Membership request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Membership request already decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clubs/{club_id}/domains:
    post:
      tags:
      - Clubs & Membership
      summary: Create Domain
      operationId: create_domain_clubs__club_id__domains_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainOut'
        '403':
          description: Caller is not this club's Club Head
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Clubs & Membership
      summary: List Domains
      operationId: list_domains_clubs__club_id__domains_get
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DomainOut'
                title: Response List Domains Clubs  Club Id  Domains Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /domains/{domain_id}/recruitment:
    patch:
      tags:
      - Clubs & Membership
      summary: Toggle Recruitment
      operationId: toggle_recruitment_domains__domain_id__recruitment_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: domain_id
        in: path
        required: true
        schema:
          type: integer
          title: Domain Id
      - name: recruitment_open
        in: query
        required: true
        schema:
          type: boolean
          title: Recruitment Open
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainOut'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /domains/{domain_id}:
    delete:
      tags:
      - Clubs & Membership
      summary: Delete Domain
      operationId: delete_domain_domains__domain_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: domain_id
        in: path
        required: true
        schema:
          type: integer
          title: Domain Id
      responses:
        '204':
          description: Successful Response
        '403':
          description: Caller is not this club's Club Head
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Domain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Domain has Pending or Selected volunteer applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clubs/{club_id}/volunteer-applications:
    post:
      tags:
      - Clubs & Membership
      summary: Apply As Volunteer
      operationId: apply_as_volunteer_clubs__club_id__volunteer_applications_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolunteerApplicationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerApplicationOut'
        '404':
          description: Domain not found or recruitment closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Already applied to this domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Clubs & Membership
      summary: List Volunteer Applications
      operationId: list_volunteer_applications_clubs__club_id__volunteer_applications_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      - name: status_filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Filter
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VolunteerApplicationOut'
                title: Response List Volunteer Applications Clubs  Club Id  Volunteer
                  Applications Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clubs/{club_id}/volunteer-applications/{application_id}/review:
    post:
      tags:
      - Clubs & Membership
      summary: Review Volunteer Application
      operationId: review_volunteer_application_clubs__club_id__volunteer_applications__application_id__review_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationReview'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerApplicationOut'
        '403':
          description: Caller is not this club's Club Head
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Application already decided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clubs/{club_id}/volunteer-applications/{application_id}/revoke:
    post:
      tags:
      - Clubs & Membership
      summary: Revoke Volunteer Application
      operationId: revoke_volunteer_application_clubs__club_id__volunteer_applications__application_id__revoke_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerApplicationOut'
        '403':
          description: Caller is not this club's Club Head
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Application is not currently Selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /clubs/{club_id}/volunteer-applications/{application_id}/reopen:
    post:
      tags:
      - Clubs & Membership
      summary: Reopen Volunteer Application
      operationId: reopen_volunteer_application_clubs__club_id__volunteer_applications__application_id__reopen_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: club_id
        in: path
        required: true
        schema:
          type: integer
          title: Club Id
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerApplicationOut'
        '403':
          description: Caller is not this club's Club Head
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: Application is not Rejected or Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /venues:
    get:
      tags:
      - Venues, Inventory & Bookings
      summary: List Venues
      operationId: list_venues_venues_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VenueOut'
                type: array
                title: Response List Venues Venues Get
    post:
      tags:
      - Venues, Inventory & Bookings
      summary: Create Venue
      operationId: create_venue_venues_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueOut'
        '422':
          description: Validation Error
          content:
            application/json:
