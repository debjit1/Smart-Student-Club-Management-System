      description: 'Cross-cutting platform feature backing every role''s notification
        feed: summarizes a caller''s unread notifications (approvals, rejections,
        deadlines) into a short digest plus up to 3 highlight bullets. Calls Gemini
        (GEMINI_API_KEY) when configured; otherwise falls back to a deterministic
        count-based summary -- `source` in the response tells the caller which path
        was used.'
