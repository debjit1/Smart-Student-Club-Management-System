    post:
      tags:
      - LLM-Assisted Features
      summary: Event Proposal Assistant
      description: 'Supports Story 3.1 (Event Proposal Pipeline): when a Club Head
        is creating a new event proposal, this endpoint takes a minimal input (event
        name, objective, expected participants) and returns a fully drafted proposal
        including: event description, agenda, budget estimate, required inventory,
        volunteer requirements, risk assessment, and a planning timeline. Uses Gemini
        when GEMINI_API_KEY is set; otherwise falls back to a deterministic heuristic.
        The response''s `source` field indicates which path was used.'
      operationId: event_proposal_assist_llm_event_proposal_assist_post
      requestBody:
        content:
          application/json:
            schema:
